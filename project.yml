name: Exhale
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Exhale:
    type: application
    platform: iOS
    sources:
      - path: Exhale
      - path: Shared
    dependencies:
      - target: ExhaleWidget
    info:
      path: Exhale/Info.plist
      properties:
        CFBundleDisplayName: Exhale
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.soum91.exhale.refresh]
        NSLocationWhenInUseUsageDescription: Exhale uses your location to run scenes when you arrive or leave home.
        NSLocationAlwaysAndWhenInUseUsageDescription: Exhale runs your arrive and leave home scenes in the background, even when the app is closed. Choose Always for that to work.
        NSPhotoLibraryAddUsageDescription: Exhale saves the Smart Life login QR to Photos so you can pick it from Smart Life's scanner.
        LSApplicationQueriesSchemes: [smartlife, tuyasmart]
        CFBundleURLTypes:
          - CFBundleURLName: com.soum91.exhale
            CFBundleURLSchemes: [exhale]
    entitlements:
      path: Exhale/Exhale.entitlements
      properties:
        com.apple.security.application-groups: [group.com.soum91.exhale]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.exhale
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  ExhaleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ExhaleWidget
      - path: Shared
    info:
      path: ExhaleWidget/Info.plist
      properties:
        CFBundleDisplayName: Exhale
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ExhaleWidget/ExhaleWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.soum91.exhale]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.exhale.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
